name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: has a new git on the runner changed what git writes?
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: tests and corpus (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The corpus was made with GNU diffutils 3.10, and 3.12 quotes fewer
      # file names (SPEC.md, "GNU diff"), so the comparison below uses 3.10.
      # A mirror that stalls must not hold the job until its time limit, so each
      # download has a time limit of its own and the next mirror is tried.
      - name: GNU diffutils 3.10
        timeout-minutes: 8
        run: |
          cd "$RUNNER_TEMP"
          for url in https://ftpmirror.gnu.org/diffutils/diffutils-3.10.tar.xz \
                     https://ftp.gnu.org/gnu/diffutils/diffutils-3.10.tar.xz \
                     https://mirrors.kernel.org/gnu/diffutils/diffutils-3.10.tar.xz; do
            curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o diffutils.tar.xz "$url" && break
          done
          echo "90e5e93cc724e4ebe12ede80df1634063c7a855692685919bfe60b556c9bd09e  diffutils.tar.xz" | sha256sum -c -
          tar xJf diffutils.tar.xz
          cd diffutils-3.10
          ./configure --quiet --disable-nls --prefix="$RUNNER_TEMP/diffutils"
          make -j4 >/dev/null
          make install >/dev/null
          echo "$RUNNER_TEMP/diffutils/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          node --version
          git --version
          diff --version | head -n 1
          python3 --version
      - name: The suite's own tests
        run: npm test
      - name: Rebuild every vector with this machine's git and diff, and compare
        run: node src/generate.js --check

  portable:
    name: corpus as checked out on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # Needs nothing but Python: parses all vectors with the reference parser,
      # compares with the expectations and applies the hunks. Fails if a
      # checkout has converted line endings in the test data.
      - run: python reference/python/check_corpus.py

  parsers:
    name: every parser and applier; RESULTS.md is what the parsers produce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: adapters/go/go.mod
          cache-dependency-path: adapters/go/go.sum
      - name: JavaScript parsers
        run: npm ci --no-audit --no-fund
        working-directory: adapters/node
      - name: Python parsers
        run: |
          python -m venv adapters/python/.venv
          adapters/python/.venv/bin/pip install --disable-pip-version-check -r adapters/python/requirements.txt
      - name: Go parsers
        run: go build -o bin/udts-go .
        working-directory: adapters/go
      - name: Rust parsers
        run: cargo build --release --locked
        working-directory: adapters/rust
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Java parsers
        run: adapters/java/build.sh
      - name: BSD patch, built from the pinned FreeBSD sources
        run: adapters/bsd-patch/build.sh
      - name: Bazel's native patch, PatchUtil.java at a pinned commit
        run: adapters/bazel-patch/build.sh
      - name: Run every parser over every vector
        run: node src/run.js
      # git, patch, busybox, toybox and svn are whatever this machine has, so
      # APPLY.md is produced and kept as an artifact, not compared. A tool that
      # cannot be installed is skipped.
      - name: Run every applier over every patch
        run: |
          for tool in busybox patch toybox subversion; do
            sudo apt-get install -y -qq --no-install-recommends "$tool" || true
          done
          node src/apply.js
      - name: RESULTS.md is up to date
        run: |
          node src/report.js
          git diff --exit-code -- RESULTS.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results
          path: |
            RESULTS.md
            APPLY.md
            results/
